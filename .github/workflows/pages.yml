name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to GitHub Pages.
# One-time setup (repository owner): Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repository>/ and updates on every push to the branches below.

on:
  push:
    branches:
      - main
      - claude/wizardly-goldberg-fkot9u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Quality gates: a failing check stops the deployment.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm contrast

      # A project site is served from /<repository>/, so the build needs that base path.
      - run: pnpm build
        env:
          BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
